name: Unity CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 结构校验：Unity 工程完整性（无需 Unity 许可证）
  # ============================================================
  validate:
    name: Project Structure Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Unity project structure
        run: |
          set -e
          echo "== ProjectVersion =="
          cat ProjectSettings/ProjectVersion.txt
          grep -q "2022.3" ProjectSettings/ProjectVersion.txt
          echo "== manifest.json =="
          python3 - <<'PY'
          import json, sys
          m = json.load(open('Packages/manifest.json'))
          deps = m['dependencies']
          required = ['com.unity.addressables', 'com.unity.burst', 'com.unity.mathematics',
                      'com.unity.test-framework', 'com.unity.textmeshpro', 'com.unity.ugui']
          for r in required:
              assert r in deps, f'missing package: {r}'
          print(f'manifest OK ({len(deps)} dependencies)')
          PY
          echo "== asmdef sanity =="
          python3 - <<'PY'
          import glob, json, os
          asmdefs = glob.glob('Assets/**/*.asmdef', recursive=True)
          assert len(asmdefs) >= 8, f'expected >=8 asmdefs, found {len(asmdefs)}'
          names = []
          for p in asmdefs:
              d = json.load(open(p, encoding='utf-8-sig'))
              names.append(d['name'])
              assert d['name'], f'unnamed asmdef: {p}'
          assert len(names) == len(set(names)), 'duplicate asmdef names'
          print(f'{len(asmdefs)} asmdefs OK: ' + ', '.join(sorted(names)))
          PY
          echo "== vendored DOTween =="
          test -f Assets/Plugins/DOTween/DOTween.dll
          echo "ALL STRUCTURE CHECKS PASSED"

  # ============================================================
  # 全量 C# 编译：28 个程序集（引擎 + 包 + 项目代码），零错误门槛
  # 无需 Unity 许可证：Roslyn + Unity 2022.3.62 引用程序集
  # ============================================================
  compile:
    name: C# Compilation (License-Free)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extract refs version
        id: refsver
        run: |
          v=$(grep -oP 'REFS_VERSION = "\K[^"]+' ci/fetch_refs.py)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "refs version: $v"

      - name: Cache reference assemblies
        uses: actions/cache@v4
        with:
          path: refs
          key: tcr-refs-${{ steps.refsver.outputs.version }}-${{ hashFiles('ci/fetch_refs.py') }}
          restore-keys: |
            tcr-refs-${{ steps.refsver.outputs.version }}-

      - name: Fetch reference assemblies
        run: python3 ci/fetch_refs.py

      - name: Compile all assemblies
        run: python3 ci/compile.py

      - name: Verify zero-error gate
        run: |
          test -f refs/build/TomCatRunner.Tests.dll
          test -f refs/build/Assembly-CSharp-Editor.dll
          count=$(ls refs/build/*.dll | wc -l)
          echo "compiled assemblies: $count"
          test "$count" -ge 27

      - name: Upload compiled assemblies
        uses: actions/upload-artifact@v4
        with:
          name: TomCatRunner-Compiled-Assemblies
          path: refs/build/*.dll
          if-no-files-found: error
          retention-days: 30

      - name: Build source archive
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=TomCatRunner-src/ -o dist/TomCatRunner-source.zip HEAD
          cd refs/build && zip -q -r ../../dist/TomCatRunner-compiled-dlls.zip *.dll && cd ../..
          ls -la dist/

      - name: Upload distributables
        uses: actions/upload-artifact@v4
        with:
          name: TomCatRunner-Distributables
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  # ============================================================
  # Unity Player 构建（Windows .exe + WebGL）
  # 只需一个 Secret：UNITY_LICENSE
  # - 旧版 Unity Hub（< 3.7）：C:\ProgramData\Unity\Unity_lic.ulf 的内容
  # - 新版 Unity Hub（>= 3.7）：%LOCALAPPDATA%\Unity\licenses\UnityEntitlementLicense.xml 的内容
  # - 两种格式 game-ci/unity-builder 都能直接消费，无需 EMAIL/PASSWORD
  # ============================================================
  unity_build:
    name: Unity Player Build (Win64 + WebGL)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: validate
    # tag 推送或手动触发时运行；UNITY_LICENSE secret 已在仓库配置
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}-${{ github.sha }}
          restore-keys: |
            Library-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}-
            Library-

      - name: Write license file from secret
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          mkdir -p "$HOME/.local/share/unity3d/Unity"
          printf '%s' "$UNITY_LICENSE" > "$HOME/.local/share/unity3d/Unity/Unity_lic.ulf"
          echo "License file written ($(wc -c < "$HOME/.local/share/unity3d/Unity/Unity_lic.ulf") bytes)"
          # 同时写一份到 game-ci 期望的位置
          mkdir -p "/Library/Application Support/Unity" 2>/dev/null || true
          printf '%s' "$UNITY_LICENSE" > "/Library/Application Support/Unity/Unity_lic.ulf" 2>/dev/null || true

      - name: Build Windows x86_64 Standalone
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          targetPlatform: StandaloneWindows64
          buildName: TomCatRunner
          buildsPath: builds/Win64
          buildMethod: TomCatRunner.Editor.CIBuildScript.BuildWindows64
          unityVersion: 2022.3.62f3
          allowDirtyBuild: true

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          targetPlatform: WebGL
          buildName: TomCatRunner
          buildsPath: builds/WebGL
          buildMethod: TomCatRunner.Editor.CIBuildScript.BuildWebGL
          unityVersion: 2022.3.62f3
          allowDirtyBuild: true

      - name: Pack Windows build
        run: |
          cd builds/Win64 && zip -q -r ../../TomCatRunner-Win64.zip . && cd ../..
          ls -la TomCatRunner-Win64.zip

      - name: Pack WebGL build
        run: |
          cd builds/WebGL && zip -q -r ../../TomCatRunner-WebGL.zip . && cd ../..
          ls -la TomCatRunner-WebGL.zip

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: TomCatRunner-Win64
          path: TomCatRunner-Win64.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Upload WebGL build
        uses: actions/upload-artifact@v4
        with:
          name: TomCatRunner-WebGL
          path: TomCatRunner-WebGL.zip
          if-no-files-found: warn
          retention-days: 30

  # ============================================================
  # 部署 WebGL 到 GitHub Pages
  # ============================================================
  deploy_pages:
    name: Deploy WebGL to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: unity_build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download WebGL build
        uses: actions/download-artifact@v4
        with:
          name: TomCatRunner-WebGL
          path: webgl

      - name: Unzip into Pages artifact
        run: |
          mkdir -p _site
          unzip -q webgl/TomCatRunner-WebGL.zip -d _site
          # GitHub Pages 需要 .nojekyll 防止下划线目录被跳过
          touch _site/.nojekyll
          ls _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  # ============================================================
  # 发布：tag (v*) 时创建 GitHub Release（源码 + 编译产物 + Unity Player 产物）
  # ============================================================
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [compile]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download distributables
        uses: actions/download-artifact@v4
        with:
          name: TomCatRunner-Distributables
          path: dist

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: TomCatRunner-Win64
          path: dist
        continue-on-error: true

      - name: Download WebGL build
        uses: actions/download-artifact@v4
        with:
          name: TomCatRunner-WebGL
          path: dist
        continue-on-error: true

      - name: List release assets
        run: ls -la dist/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > release_notes.md <<'EOF'
          # TomCatRunner ${{ github.ref_name }}

          ## 本次 Release 包含

          - `TomCatRunner-source.zip` — 完整源码
          - `TomCatRunner-compiled-dlls.zip` — CI 编译出的全部程序集 DLL（无 License 构建）
          - `TomCatRunner-Win64.zip` — Windows x86_64 可执行程序（需配置 UNITY_LICENSE secret 才会生成）
          - `TomCatRunner-WebGL.zip` — WebGL 浏览器版构建包（同上）

          ## v2.0.0 关键变更

          - 新增三个完整场景：**Boot.unity** / **SeasonHub.unity** / **Gameplay.unity**
          - 新增 8 个 URP/Lit 材质（玩家、障碍、金币、地面、春/夏/冬赛季门）
          - 新增 4 个 Prefab（Player / Obstacle / Coin / Ground）
          - 新增 TagManager（Player / Obstacle / Coin / Ground / SeasonGate）
          - EditorBuildSettings 配齐三场景，Boot 场景已挂 GameLifetimeScope
          - 新增 Unity Player 构建 job（Windows Standalone + WebGL）
          - 新增 GitHub Pages 自动部署 job

          ## 如何获取可执行的 .exe / WebGL

          Unity Player 构建需要 Unity Personal License（**免费**）：
          1. 注册 Unity ID（https://id.unity.com）并安装 Unity Hub
          2. Hub 登录账号即自动激活 Personal License（不需要手动点按钮）
          3. 找到 License 文件（两种格式都可，复制内容）：
             - 新版 Hub（3.7+）：`UnityEntitlementLicense.xml`
             - 旧版 Hub：`Unity_lic.ulf`
          4. 在 GitHub repo Settings → Secrets and variables → Actions 添加 1 个 Secret：
             - `UNITY_LICENSE`：上面文件的完整 XML 内容（明文粘贴，不要 base64）
          5. 在同一页面 Variables 标签添加：
             - `UNITY_LICENSE_CONFIGURED` = `true`
          6. 手动触发 Actions → Unity CI/CD Pipeline → Run workflow
          7. 构建完成后 .exe 和 WebGL zip 会出现在最新 Release
          8. WebGL 同时部署到 GitHub Pages：https://cshdotcom.github.io/TomCatRunner/

          详细路径和排错见 README「获取 Unity Personal License」一节

          ## 如何在 Unity 编辑器中打开

          1. 安装 Unity **2022.3.62f1**（LTS）
          2. Unity Hub → Open → 选择本仓库根目录
          3. 首次打开自动导入 VContainer / UniTask / UniRx / Addressables / DOTween
          4. 打开 `Assets/_Project/Scenes/Boot.unity` 按 ▶ 即可启动

          ## License-Free CI 兜底

          即使未配置 Unity License，本仓库仍可：
          - 通过 `ci/compile.py` 用 Roslyn 编译全部 27+ 个 C# 程序集零错误
          - 提供完整源码 + 编译产物 DLL
          - 在 Unity 编辑器中本地构建 Player

          ## 关键修复历史

          - 补齐缺失的 Unity 工程文件（ProjectSettings / Packages/manifest.json）
          - 合并两代架构（Core 流式管线 + Seasons 赛季系统），统一数据模型
          - 修复 ~120 处编译错误（命名空间、虚构 API、重复类型、过时 API）
          - DOTween 官方 DLL 已内嵌（Plugins/DOTween），项目开箱可用
          EOF

          # 上传所有存在的产物（用 continue-on-error 兼容缺失）
          ASSETS=""
          for f in TomCatRunner-source.zip TomCatRunner-compiled-dlls.zip TomCatRunner-Win64.zip TomCatRunner-WebGL.zip; do
            if [ -f "dist/$f" ]; then ASSETS="$ASSETS dist/$f"; fi
          done

          gh release create "$TAG" \
            --title "TomCatRunner $TAG" \
            --notes-file release_notes.md \
            $ASSETS
