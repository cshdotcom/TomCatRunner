          UNITY_PATH=""
          
          # Check common installation paths
          for path in \
            "/opt/unity/Editor/2022.3.21f1/Editor/Unity" \
            "$HOME/.local/share/unity/Editor/2022.3.21f1/Editor/Unity" \
            "$HOME/unity/Editor/2022.3.21f1/Editor/Unity" \
            "/opt/unity/Editor/2022.3.21f1/Editor/Unity" \
            "/usr/local/unity/Editor/2022.3.21f1/Editor/Unity"; do
            if [ -f "$path" ]; then
              UNITY_PATH="$path"
              echo "Unity found at: $UNITY_PATH"
              break
            fi
          done
          
          # If not found, try to find it with unity editors command
          if [ -z "$UNITY_PATH" ]; then
            echo "Searching for Unity installation via 'unity editors' command..."
            unity editors 2>&1 | while IFS= read -r line; do
              if echo "$line" | grep -q "2022.3.21f1"; then
                # Extract path from line like: 2022.3.21f1  /path/to/unity
                path=$(echo "$line" | awk '{print $2}')
                if [ -f "$path/Editor/Unity" ]; then
                  UNITY_PATH="$path/Editor/Unity"
                  echo "Unity found via 'unity editors': $UNITY_PATH"
                  break
                fi
              fi
            done
          fi
          
          if [ -n "$UNITY_PATH" ]; then
            echo "Unity installation verified at: $UNITY_PATH"
            "$UNITY_PATH" -version
            # Create symlink for consistency
            sudo mkdir -p /opt/unity/Editor/2022.3.21f1
            sudo ln -sf "$(dirname "$UNITY_PATH")" /opt/unity/Editor/2022.3.21f1
          else
            echo "Unity binary not found in any known location"
            echo "Trying to list all unity editors..."
            unity editors
            exit 1
          fi

      - name: Activate Unity License
        run: |
          /opt/unity/Editor/${UNITY_VERSION}/Editor/Unity -batchmode -nographics -projectPath ${{ env.PROJECT_PATH }} -logFile - -username "${UNITY_USERNAME}" -password "${UNITY_PASSWORD}" -quit 2>&1 | tail -20

      - name: Restore Packages
        run: |
          /opt/unity/Editor/${UNITY_VERSION}/Editor/Unity -batchmode -nographics -projectPath ${{ env.PROJECT_PATH }} -quit -logFile - 2>&1 | tail -20

      - name: Run PlayMode Tests
        uses: game-ci/unity-test-runner@v2
        env:
          UNITY_USERNAME: ${{ secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT_PATH }}
          testMode: playmode
          artifactsPath: artifacts/playmode
          customParameters: -batchmode -nographics -logFile -

      - name: Upload PlayMode Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playmode-test-results
          path: artifacts/playmode
          retention-days: 7

  # ============================================
  # WINDOWS STANDALONE BUILD
  # ============================================
  build-windows:
    name: Build Windows Standalone
    runs-on: windows-latest
    timeout-minutes: 60
    needs: [editmode-tests, playmode-tests]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Cache Library
        uses: actions/cache@v4
        with:
