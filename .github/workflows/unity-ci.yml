            Library-${{ runner.os }}-

      - name: Install Unity
        run: |
          # Install Unity using official Unity CLI (recommended for CI)
          echo "Installing Unity CLI and Unity Editor..."
          
          # Install Unity CLI
          curl -fsSL https://unity.com/install.sh | bash
          
          # Add Unity CLI to PATH
          export PATH="$HOME/.local/bin:$PATH"
          
          # Install Unity Editor with required modules
          unity install 2022.3.21f1 --module linux-il2cpp --module linux-webgl --module android 2>&1 | tail -30
          
          # Find Unity installation path
          echo "Finding Unity installation..."
          UNITY_PATH=""
          
          # Check common installation paths
          for path in \
            "/opt/unity/Editor/2022.3.21f1/Editor/Unity" \
            "$HOME/.local/share/unity/Editor/2022.3.21f1/Editor/Unity" \
            "$HOME/unity/Editor/2022.3.21f1/Editor/Unity" \
            "/opt/unity/Editor/2022.3.21f1/Editor/Unity" \
            "/usr/local/unity/Editor/2022.3.21f1/Editor/Unity"; do
            if [ -f "$path" ]; then
              UNITY_PATH="$path"
              echo "Unity found at: $UNITY_PATH"
              break
            fi
          done
          
          # If not found, try to find it with unity editors command
          if [ -z "$UNITY_PATH" ]; then
            echo "Searching for Unity installation via 'unity editors' command..."
            unity editors 2>&1 | while IFS= read -r line; do
              if echo "$line" | grep -q "2022.3.21f1"; then
                # Extract path from line like: 2022.3.21f1  /path/to/unity
                path=$(echo "$line" | awk '{print $2}')
                if [ -f "$path/Editor/Unity" ]; then
                  UNITY_PATH="$path/Editor/Unity"
                  echo "Unity found via 'unity editors': $UNITY_PATH"
                  break
                fi
              fi
            done
          fi
          
          if [ -n "$UNITY_PATH" ]; then
            echo "Unity installation verified at: $UNITY_PATH"
            "$UNITY_PATH" -version
            # Create symlink for consistency
            sudo mkdir -p /opt/unity/Editor/2022.3.21f1
            sudo ln -sf "$(dirname "$UNITY_PATH")" /opt/unity/Editor/2022.3.21f1
          else
            echo "Unity binary not found in any known location"
            echo "Trying to list all unity editors..."
            unity editors
            exit 1
          fi

      - name: Activate Unity License
        run: |
          & "C:\Program Files\Unity\Hub\Editor\${env:UNITY_VERSION}\Editor\Unity.exe" -batchmode -nographics -projectPath ${{ env.PROJECT_PATH }} -logFile - -username "${UNITY_USERNAME}" -password "${UNITY_PASSWORD}" -quit

      - name: Build Windows Standalone
        uses: game-ci/unity-builder@v2
        env:
          UNITY_USERNAME: ${{ secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: StandaloneWindows64
          buildPath: ${{ env.BUILD_PATH }}/Windows/TomCatRunner.exe
          customParameters: -batchmode -nographics -logFile -

      - name: Compress Build
        run: |
          cd ${{ env.BUILD_PATH }}\Windows
          Compress-Archive -Path * -DestinationPath TomCatRunner_Windows.zip

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: TomCatRunner-Windows
          path: ${{ env.BUILD_PATH }}\Windows\TomCatRunner_Windows.zip
          retention-days: 30

