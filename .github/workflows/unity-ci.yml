name: Unity CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 结构校验：Unity 工程完整性（无需 Unity 许可证）
  # ============================================================
  validate:
    name: Project Structure Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Unity project structure
        run: |
          set -e
          echo "== ProjectVersion =="
          cat ProjectSettings/ProjectVersion.txt
          grep -q "2022.3" ProjectSettings/ProjectVersion.txt
          echo "== manifest.json =="
          python3 - <<'PY'
          import json, sys
          m = json.load(open('Packages/manifest.json'))
          deps = m['dependencies']
          required = ['com.unity.addressables', 'com.unity.burst', 'com.unity.mathematics',
                      'com.unity.test-framework', 'com.unity.textmeshpro', 'com.unity.ugui']
          for r in required:
              assert r in deps, f'missing package: {r}'
          print(f'manifest OK ({len(deps)} dependencies)')
          PY
          echo "== asmdef sanity =="
          python3 - <<'PY'
          import glob, json, os
          asmdefs = glob.glob('Assets/**/*.asmdef', recursive=True)
          assert len(asmdefs) >= 8, f'expected >=8 asmdefs, found {len(asmdefs)}'
          names = []
          for p in asmdefs:
              d = json.load(open(p, encoding='utf-8-sig'))
              names.append(d['name'])
              assert d['name'], f'unnamed asmdef: {p}'
          assert len(names) == len(set(names)), 'duplicate asmdef names'
          print(f'{len(asmdefs)} asmdefs OK: ' + ', '.join(sorted(names)))
          PY
          echo "== vendored DOTween =="
          test -f Assets/Plugins/DOTween/DOTween.dll
          echo "ALL STRUCTURE CHECKS PASSED"

  # ============================================================
  # 全量 C# 编译：28 个程序集（引擎 + 包 + 项目代码），零错误门槛
  # 无需 Unity 许可证：Roslyn + Unity 2022.3.62 引用程序集
  # ============================================================
  compile:
    name: C# Compilation (License-Free)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extract refs version
        id: refsver
        run: |
          v=$(grep -oP 'REFS_VERSION = "\K[^"]+' ci/fetch_refs.py)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "refs version: $v"

      - name: Cache reference assemblies
        uses: actions/cache@v4
        with:
          path: refs
          key: tcr-refs-${{ steps.refsver.outputs.version }}-${{ hashFiles('ci/fetch_refs.py') }}
          restore-keys: |
            tcr-refs-${{ steps.refsver.outputs.version }}-

      - name: Fetch reference assemblies
        run: python3 ci/fetch_refs.py

      - name: Compile all assemblies
        run: python3 ci/compile.py

      - name: Verify zero-error gate
        run: |
          test -f refs/build/TomCatRunner.Tests.dll
          test -f refs/build/Assembly-CSharp-Editor.dll
          count=$(ls refs/build/*.dll | wc -l)
          echo "compiled assemblies: $count"
          test "$count" -ge 27

      - name: Upload compiled assemblies
        uses: actions/upload-artifact@v4
        with:
          name: TomCatRunner-Compiled-Assemblies
          path: refs/build/*.dll
          if-no-files-found: error
          retention-days: 30

      - name: Build source archive
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=TomCatRunner-src/ -o dist/TomCatRunner-source.zip HEAD
          cd refs/build && zip -q -r ../../dist/TomCatRunner-compiled-dlls.zip *.dll && cd ../..
          ls -la dist/

      - name: Upload distributables
        uses: actions/upload-artifact@v4
        with:
          name: TomCatRunner-Distributables
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  # ============================================================
  # 发布：tag (v*) 时创建 GitHub Release（源码 + 编译产物）
  # ============================================================
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: compile
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download distributables
        uses: actions/download-artifact@v4
        with:
          name: TomCatRunner-Distributables
          path: dist

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > release_notes.md <<'EOF'
          # TomCatRunner ${{ github.ref_name }}

          ## 编译产物 (License-Free CI)

          本 Release 由 GitHub Actions 全自动构建：**28 个 C# 程序集零错误编译通过**
          （引擎引用 + Unity 官方包 + 第三方库 + 全部项目代码）。

          - `TomCatRunner-source.zip` — 完整源码
          - `TomCatRunner-compiled-dlls.zip` — CI 编译出的全部程序集 DLL

          ## 如何在 Unity 中打开

          1. 安装 Unity **2022.3.62f3** (LTS)
          2. 用 Unity Hub 打开本项目根目录
          3. 首次打开时 Unity 会自动生成 .meta 文件与 Library

          > CI 编译管线（`ci/`）不依赖 Unity 许可证，使用 Roslyn +
          > Unity 2022.3 官方引用程序集复现编辑器内编译行为。

          ## 关键修复

          - 补齐缺失的 Unity 工程文件（ProjectSettings / Packages/manifest.json）
          - 合并两代架构（Core 流式管线 + Seasons 赛季系统），统一数据模型
          - 补全缺失模块：UI Framework、ViewModel 基建、Reactive 总线、关卡生成器、LevelValidator
          - 修复 ~120 处编译错误（命名空间、虚构 API、重复类型、过时 API）
          - DOTween 官方 DLL 已内嵌（Plugins/DOTween），项目开箱可用
          EOF
          gh release create "$TAG" \
            --title "TomCatRunner $TAG" \
            --notes-file release_notes.md \
            dist/TomCatRunner-source.zip \
            dist/TomCatRunner-compiled-dlls.zip
