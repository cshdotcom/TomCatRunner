name: Unity CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

env:
  UNITY_VERSION: 2022.3.21f1
  UNITY_USERNAME: ${{ secrets.UNITY_USERNAME }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
  PROJECT_PATH: .
  BUILD_PATH: Builds

jobs:
  # ============================================
  # EDIT MODE TESTS
  # ============================================
  editmode-tests:
    name: EditMode Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ runner.os }}-

      - name: Install Unity
        run: |
          # Download and install Unity Editor
          # Try multiple URL formats for Unity 2022.3.21f1
          UNITY_VERSION_CLEAN="2022.3.21f1"
          UNITY_URL_1="https://download.unity3d.com/download_unity/2022.3.21f1/linux-unity-editor-installer-2022.3.21f1.sh"
          UNITY_URL_2="https://download.unity3d.com/download_unity/2022.3.21f1/unity-editor-installer-2022.3.21f1.sh"
          UNITY_URL_3="https://download.unity3d.com/download_unity/2022.3.21f1/unity-editor-2022.3.21f1-linux.sh"
          
          for url in "$UNITY_URL_1" "$UNITY_URL_2" "$UNITY_URL_3"; do
            echo "Trying: $url"
            if curl -fsSL "$url" -o unity-installer.sh; then
              echo "Downloaded from: $url"
              break
            fi
          done
          
          if [ ! -f unity-installer.sh ] || [ ! -s unity-installer.sh ]; then
            echo "All URLs failed, trying tar.xz format..."
            UNITY_URL_TAR="https://download.unity3d.com/download_unity/2022.3.21f1/unity-editor-2022.3.21f1-linux-x64.tar.xz"
            if curl -fsSL "$UNITY_URL_TAR" -o unity-editor.tar.xz; then
              echo "Downloaded tar.xz from: $UNITY_URL_TAR"
              mkdir -p /opt/unity/Editor/2022.3.21f1
              tar -xf unity-editor.tar.xz -C /opt/unity/Editor/2022.3.21f1 --strip-components=1
              echo "Unity extracted successfully"
              exit 0
            fi
            echo "All download attempts failed"
            exit 1
          fi
          
          chmod +x unity-installer.sh
          ./unity-installer.sh --install-location=/opt/unity/Editor/2022.3.21f1 --components=unity-editor,unity-android,unity-webgl --unattended 2>&1 | tail -20

      - name: Activate Unity License
        run: |
          /opt/unity/Editor/${UNITY_VERSION}/Editor/Unity -batchmode -nographics -projectPath ${{ env.PROJECT_PATH }} -logFile - -username "${UNITY_USERNAME}" -password "${UNITY_PASSWORD}" -quit 2>&1 | tail -20

      - name: Restore Packages
        run: |
          /opt/unity/Editor/${UNITY_VERSION}/Editor/Unity -batchmode -nographics -projectPath ${{ env.PROJECT_PATH }} -quit -logFile - 2>&1 | tail -20

      - name: Run EditMode Tests
        run: |
          /opt/unity/Editor/${UNITY_VERSION}/Editor/Unity -batchmode -nographics -projectPath ${{ env.PROJECT_PATH }} -runTests -testPlatform editmode -testResults artifacts/editmode/test-results.xml -logFile - 2>&1 | tail -20

      - name: Upload EditMode Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editmode-test-results
          path: artifacts/editmode
          retention-days: 7

  # ============================================
  # PLAY MODE TESTS
  # ============================================
  playmode-tests:
    name: PlayMode Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ runner.os }}-

      - name: Install Unity
        run: |
          # Install Unity via official Unity Hub apt repository (most reliable)
          echo "Installing Unity Hub and Unity Editor via apt..."
          
          # Add Unity Hub repository
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://hub.unity3d.com/linux/keys/public | sudo gpg --dearmor -o /etc/apt/keyrings/unityhub.gpg
          sudo tee /etc/apt/sources.list.d/unityhub.sources > /dev/null << EOF
Types: deb
URIs: https://hub.unity3d.com/linux/repos/deb
Suites: stable
Components: main
Signed-By: /etc/apt/keyrings/unityhub.gpg
EOF
          
          # Update and install Unity Hub
          sudo apt update
          sudo apt install -y unityhub
          
          # Use Unity Hub to install specific Unity version
          /opt/unityhub/unityhub -- --headless install --version 2022.3.21f1 --childModules linux-il2cpp,linux-webgl,android 2>&1 | tail -30
          
          # Verify installation
          if [ -f "/opt/unity/Editor/2022.3.21f1/Editor/Unity" ]; then
            echo "Unity installation verified"
            /opt/unity/Editor/2022.3.21f1/Editor/Unity -version
          else
            echo "Unity binary not found after installation"
            exit 1
          fi

      - name: Activate Unity License
        run: |
          /opt/unity/Editor/${UNITY_VERSION}/Editor/Unity -batchmode -nographics -projectPath ${{ env.PROJECT_PATH }} -logFile - -username "${UNITY_USERNAME}" -password "${UNITY_PASSWORD}" -quit 2>&1 | tail -20

      - name: Restore Packages
        run: |
          /opt/unity/Editor/${UNITY_VERSION}/Editor/Unity -batchmode -nographics -projectPath ${{ env.PROJECT_PATH }} -quit -logFile - 2>&1 | tail -20

      - name: Run PlayMode Tests
        run: |
          /opt/unity/Editor/${UNITY_VERSION}/Editor/Unity -batchmode -nographics -projectPath ${{ env.PROJECT_PATH }} -runTests -testPlatform playmode -testResults artifacts/playmode/test-results.xml -logFile - 2>&1 | tail -20

      - name: Upload PlayMode Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playmode-test-results
          path: artifacts/playmode
          retention-days: 7

  # ============================================
  # WINDOWS STANDALONE BUILD
  # ============================================
  build-windows:
    name: Build Windows Standalone
    runs-on: windows-latest
    timeout-minutes: 60
    needs: [editmode-tests, playmode-tests]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ runner.os }}-

      - name: Install Unity
        run: |
          $unityUrl = "https://download.unity3d.com/download_unity/win64_unity-editor-installer-${env:UNITY_VERSION}.exe"
          Invoke-WebRequest -Uri $unityUrl -OutFile "unity_installer.exe"
          Start-Process -FilePath "unity_installer.exe" -ArgumentList "/S /D=C:\Unity\Editor\${env:UNITY_VERSION} /Components=Unity-Editor,Unity-Android,Unity-WebGL" -Wait

      - name: Activate Unity License
        run: |
          & "C:\Unity\Editor\${env:UNITY_VERSION}\Editor\Unity.exe" -batchmode -nographics -projectPath ${{ env.PROJECT_PATH }} -logFile - -username "${UNITY_USERNAME}" -password "${UNITY_PASSWORD}" -quit

      - name: Build Windows Standalone
        run: |
          & "C:\Unity\Editor\${env:UNITY_VERSION}\Editor\Unity.exe" -batchmode -nographics -projectPath ${{ env.PROJECT_PATH }} -buildWindows64Player "${{ env.BUILD_PATH }}\Windows\TomCatRunner.exe" -logFile - -quit

      - name: Compress Build
        run: |
          cd ${{ env.BUILD_PATH }}\Windows
          Compress-Archive -Path * -DestinationPath TomCatRunner_Windows.zip

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: TomCatRunner-Windows
          path: ${{ env.BUILD_PATH }}\Windows\TomCatRunner_Windows.zip
          retention-days: 30

  # ============================================
  # WEBGL BUILD
  # ============================================
  build-webgl:
    name: Build WebGL
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [editmode-tests, playmode-tests]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ runner.os }}-

      - name: Install Unity
        run: |
          # Install Unity via official Unity Hub apt repository (most reliable)
          echo "Installing Unity Hub and Unity Editor via apt..."
          
          # Add Unity Hub repository
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://hub.unity3d.com/linux/keys/public | sudo gpg --dearmor -o /etc/apt/keyrings/unityhub.gpg
          sudo tee /etc/apt/sources.list.d/unityhub.sources > /dev/null << EOF
Types: deb
URIs: https://hub.unity3d.com/linux/repos/deb
Suites: stable
Components: main
Signed-By: /etc/apt/keyrings/unityhub.gpg
EOF
          
          # Update and install Unity Hub
          sudo apt update
          sudo apt install -y unityhub
          
          # Use Unity Hub to install specific Unity version
          /opt/unityhub/unityhub -- --headless install --version 2022.3.21f1 --childModules linux-il2cpp,linux-webgl,android 2>&1 | tail -30
          
          # Verify installation
          if [ -f "/opt/unity/Editor/2022.3.21f1/Editor/Unity" ]; then
            echo "Unity installation verified"
            /opt/unity/Editor/2022.3.21f1/Editor/Unity -version
          else
            echo "Unity binary not found after installation"
            exit 1
          fi

      - name: Activate Unity License
        run: |
          /opt/unity/Editor/${UNITY_VERSION}/Editor/Unity -batchmode -nographics -projectPath ${{ env.PROJECT_PATH }} -logFile - -username "${UNITY_USERNAME}" -password "${UNITY_PASSWORD}" -quit 2>&1 | tail -20

      - name: Build WebGL
        run: |
          /opt/unity/Editor/${UNITY_VERSION}/Editor/Unity -batchmode -nographics -projectPath ${{ env.PROJECT_PATH }} -buildWebGLPlayer "${{ env.BUILD_PATH }}/WebGL" -logFile - -quit 2>&1 | tail -20

      - name: Compress WebGL Build
        run: |
          cd ${{ env.BUILD_PATH }}
          zip -r TomCatRunner_WebGL.zip WebGL

      - name: Upload WebGL Build
        uses: actions/upload-artifact@v4
        with:
          name: TomCatRunner-WebGL
          path: ${{ env.BUILD_PATH }}/TomCatRunner_WebGL.zip
          retention-days: 30

  # ============================================
  # ANDROID BUILD (APK)
  # ============================================
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [editmode-tests, playmode-tests]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ runner.os }}-

      - name: Install Unity
        run: |
          # Install Unity via official Unity Hub apt repository (most reliable)
          echo "Installing Unity Hub and Unity Editor via apt..."
          
          # Add Unity Hub repository
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://hub.unity3d.com/linux/keys/public | sudo gpg --dearmor -o /etc/apt/keyrings/unityhub.gpg
          sudo tee /etc/apt/sources.list.d/unityhub.sources > /dev/null << EOF
Types: deb
URIs: https://hub.unity3d.com/linux/repos/deb
Suites: stable
Components: main
Signed-By: /etc/apt/keyrings/unityhub.gpg
EOF
          
          # Update and install Unity Hub
          sudo apt update
          sudo apt install -y unityhub
          
          # Use Unity Hub to install specific Unity version
          /opt/unityhub/unityhub -- --headless install --version 2022.3.21f1 --childModules linux-il2cpp,linux-webgl,android 2>&1 | tail -30
          
          # Verify installation
          if [ -f "/opt/unity/Editor/2022.3.21f1/Editor/Unity" ]; then
            echo "Unity installation verified"
            /opt/unity/Editor/2022.3.21f1/Editor/Unity -version
          else
            echo "Unity binary not found after installation"
            exit 1
          fi

      - name: Activate Unity License
        run: |
          /opt/unity/Editor/${UNITY_VERSION}/Editor/Unity -batchmode -nographics -projectPath ${{ env.PROJECT_PATH }} -logFile - -username "${UNITY_USERNAME}" -password "${UNITY_PASSWORD}" -quit 2>&1 | tail -20

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 33
          ndk-version: r26c
          cmdline-tools-version: latest

      - name: Build Android APK
        run: |
          /opt/unity/Editor/${UNITY_VERSION}/Editor/Unity -batchmode -nographics -projectPath ${{ env.PROJECT_PATH }} -buildTarget Android -executeMethod TomCatRunner.Editor.CI.CIBuildScript.SetAndroidBuildAPK -buildLinux64Player "${{ env.BUILD_PATH }}/Android/TomCatRunner.apk" -logFile - -quit 2>&1 | tail -20

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: TomCatRunner-Android
          path: ${{ env.BUILD_PATH }}/Android/TomCatRunner.apk
          retention-days: 30

  # ============================================
  # RELEASE CREATION
  # ============================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-windows, build-webgl, build-android]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Windows Build
        uses: actions/download-artifact@v4
        with:
          name: TomCatRunner-Windows
          path: artifacts/Windows

      - name: Download WebGL Build
        uses: actions/download-artifact@v4
        with:
          name: TomCatRunner-WebGL
          path: artifacts/WebGL

      - name: Download Android Build
        uses: actions/download-artifact@v4
        with:
          name: TomCatRunner-Android
          path: artifacts/Android

      - name: Generate Changelog
        id: changelog
        run: |
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          git log --pretty=format:"- %s (%an)" $(git describe --tags --abbrev=0 HEAD^)..HEAD >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: TomCatRunner ${{ github.ref_name }}
          body: |
            ## 🎮 汤姆猫跑酷 - ${{ github.ref_name }}
            
            ### 📦 下载链接
            - **Windows 64位**: [TomCatRunner_Windows.zip](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/TomCatRunner_Windows.zip)
            - **WebGL (浏览器游玩)**: [TomCatRunner_WebGL.zip](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/TomCatRunner_WebGL.zip)
            - **Android (APK)**: [TomCatRunner.apk](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/TomCatRunner.apk)
            
            ### 📝 更新日志
            ${{ steps.changelog.outputs.changelog }}
            
            ### 🎯 功能特性
            - 多主题赛季系统 (春季/夏季/秋季/冬季/节日)
            - 程序化关卡生成 (CFG + 马尔可夫链)
            - 双轨战斗通行证 (免费/付费)
            - Addressables 热更管线
            - 绚丽 UI 系统 (SDF圆角/流体噪波/色差/全息扫描/边缘发光)
            - UI 粒子系统 (7种预设)
            - MotionLibrary 50+ 动画预设
            - AutoRunnerBot AI 关卡验证
            - 完整测试覆盖 (EditMode/PlayMode/性能基准)
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            artifacts/Windows/TomCatRunner_Windows.zip
            artifacts/WebGL/TomCatRunner_WebGL.zip
            artifacts/Android/TomCatRunner.apk

  # ============================================
  # PERFORMANCE BENCHMARK
  # ============================================
  performance-benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ runner.os }}-

      - name: Install Unity
        run: |
          # Install Unity via official Unity Hub apt repository (most reliable)
          echo "Installing Unity Hub and Unity Editor via apt..."
          
          # Add Unity Hub repository
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://hub.unity3d.com/linux/keys/public | sudo gpg --dearmor -o /etc/apt/keyrings/unityhub.gpg
          sudo tee /etc/apt/sources.list.d/unityhub.sources > /dev/null << EOF
Types: deb
URIs: https://hub.unity3d.com/linux/repos/deb
Suites: stable
Components: main
Signed-By: /etc/apt/keyrings/unityhub.gpg
EOF
          
          # Update and install Unity Hub
          sudo apt update
          sudo apt install -y unityhub
          
          # Use Unity Hub to install specific Unity version
          /opt/unityhub/unityhub -- --headless install --version 2022.3.21f1 --childModules linux-il2cpp,linux-webgl,android 2>&1 | tail -30
          
          # Verify installation
          if [ -f "/opt/unity/Editor/2022.3.21f1/Editor/Unity" ]; then
            echo "Unity installation verified"
            /opt/unity/Editor/2022.3.21f1/Editor/Unity -version
          else
            echo "Unity binary not found after installation"
            exit 1
          fi

      - name: Activate Unity License
        run: |
          /opt/unity/Editor/${UNITY_VERSION}/Editor/Unity -batchmode -nographics -projectPath ${{ env.PROJECT_PATH }} -logFile - -username "${UNITY_USERNAME}" -password "${UNITY_PASSWORD}" -quit 2>&1 | tail -20

      - name: Restore Packages
        run: |
          /opt/unity/Editor/${UNITY_VERSION}/Editor/Unity -batchmode -nographics -projectPath ${{ env.PROJECT_PATH }} -quit -logFile - 2>&1 | tail -20

      - name: Run Performance Tests
        run: |
          /opt/unity/Editor/${UNITY_VERSION}/Editor/Unity -batchmode -nographics -projectPath ${{ env.PROJECT_PATH }} -runTests -testPlatform playmode -testResults artifacts/performance/test-results.xml -logFile - 2>&1 | tail -20

      - name: Upload Performance Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-results
          path: artifacts/performance
          retention-days: 30