      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 33
          ndk-version: r26c
          cmdline-tools-version: latest

      - name: Build Android APK
        uses: game-ci/unity-builder@v2
        env:
          UNITY_USERNAME: ${{ secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: Android
          buildPath: ${{ env.BUILD_PATH }}/Android/TomCatRunner.apk
          customParameters: -batchmode -nographics -logFile -executeMethod TomCatRunner.Editor.CI.CIBuildScript.SetAndroidBuildAPK

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: TomCatRunner-Android
          path: ${{ env.BUILD_PATH }}/Android/TomCatRunner.apk
          retention-days: 30

  # ============================================
  # RELEASE CREATION
  # ============================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-windows, build-webgl, build-android]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Windows Build
        uses: actions/download-artifact@v4
        with:
          name: TomCatRunner-Windows
          path: artifacts/Windows

      - name: Download WebGL Build
        uses: actions/download-artifact@v4
        with:
          name: TomCatRunner-WebGL
          path: artifacts/WebGL

      - name: Download Android Build
        uses: actions/download-artifact@v4
        with:
          name: TomCatRunner-Android
          path: artifacts/Android

      - name: Generate Changelog
        id: changelog
        run: |
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          git log --pretty=format:"- %s (%an)" $(git describe --tags --abbrev=0 HEAD^)..HEAD >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: TomCatRunner ${{ github.ref_name }}
          body: |
            ## 🎮 汤姆猫跑酷 - ${{ github.ref_name }}
            
            ### 📦 下载链接
            - **Windows 64位**: [TomCatRunner_Windows.zip](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/TomCatRunner_Windows.zip)
            - **WebGL (浏览器游玩)**: [TomCatRunner_WebGL.zip](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/TomCatRunner_WebGL.zip)
            - **Android (APK)**: [TomCatRunner.apk](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/TomCatRunner.apk)
            
            ### 📝 更新日志
            ${{ steps.changelog.outputs.changelog }}
            
            ### 🎯 功能特性
            - 多主题赛季系统 (春季/夏季/秋季/冬季/节日)
            - 程序化关卡生成 (CFG + 马尔可夫链)
            - 双轨战斗通行证 (免费/付费)
            - Addressables 热更管线
            - 绚丽 UI 系统 (SDF圆角/流体噪波/色差/全息扫描/边缘发光)
            - UI 粒子系统 (7种预设)
            - MotionLibrary 50+ 动画预设
            - AutoRunnerBot AI 关卡验证
            - 完整测试覆盖 (EditMode/PlayMode/性能基准)
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            artifacts/Windows/TomCatRunner_Windows.zip
            artifacts/WebGL/TomCatRunner_WebGL.zip
            artifacts/Android/TomCatRunner.apk

  # ============================================
  # PERFORMANCE BENCHMARK
  # ============================================
  performance-benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ runner.os }}-

      - name: Install Unity
        run: |
          # Install Unity using official Unity CLI (recommended for CI)
          echo "Installing Unity CLI and Unity Editor..."
          
          # Install Unity CLI
          curl -fsSL https://unity.com/install.sh | bash
          
          # Add Unity CLI to PATH
          export PATH="$HOME/.local/bin:$PATH"
          
          # Install Unity Editor with required modules
          unity install 2022.3.21f1 --module linux-il2cpp --module linux-webgl --module android 2>&1 | tail -30
          
          # Find Unity installation path
          echo "Finding Unity installation..."
          UNITY_PATH=""
          
          # Check common installation paths
          for path in \
            "/opt/unity/Editor/2022.3.21f1/Editor/Unity" \
            "$HOME/.local/share/unity/Editor/2022.3.21f1/Editor/Unity" \
            "$HOME/unity/Editor/2022.3.21f1/Editor/Unity" \
            "/opt/unity/Editor/2022.3.21f1/Editor/Unity" \
            "/usr/local/unity/Editor/2022.3.21f1/Editor/Unity"; do
            if [ -f "$path" ]; then
              UNITY_PATH="$path"
              echo "Unity found at: $UNITY_PATH"
              break
            fi
          done
          
          # If not found, try to find it with unity editors command
          if [ -z "$UNITY_PATH" ]; then
            echo "Searching for Unity installation via 'unity editors' command..."
            unity editors 2>&1 | while IFS= read -r line; do
              if echo "$line" | grep -q "2022.3.21f1"; then
                # Extract path from line like: 2022.3.21f1  /path/to/unity
                path=$(echo "$line" | awk '{print $2}')
                if [ -f "$path/Editor/Unity" ]; then
                  UNITY_PATH="$path/Editor/Unity"
                  echo "Unity found via 'unity editors': $UNITY_PATH"
                  break
                fi
              fi
            done
          fi
          
          if [ -n "$UNITY_PATH" ]; then
            echo "Unity installation verified at: $UNITY_PATH"
            "$UNITY_PATH" -version
            # Create symlink for consistency
            sudo mkdir -p /opt/unity/Editor/2022.3.21f1
            sudo ln -sf "$(dirname "$UNITY_PATH")" /opt/unity/Editor/2022.3.21f1
          else
            echo "Unity binary not found in any known location"
            echo "Trying to list all unity editors..."
            unity editors
            exit 1
          fi

      - name: Activate Unity License
        run: |
          /opt/unity/Editor/${UNITY_VERSION}/Editor/Unity -batchmode -nographics -projectPath ${{ env.PROJECT_PATH }} -logFile - -username "${UNITY_USERNAME}" -password "${UNITY_PASSWORD}" -quit 2>&1 | tail -20

      - name: Restore Packages
        run: |
          /opt/unity/Editor/${UNITY_VERSION}/Editor/Unity -batchmode -nographics -projectPath ${{ env.PROJECT_PATH }} -quit -logFile - 2>&1 | tail -20

      - name: Run Performance Tests
        uses: game-ci/unity-test-runner@v2
        env:
          UNITY_USERNAME: ${{ secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT_PATH }}
          testMode: playmode
          categoryFilter: Performance
          artifactsPath: artifacts/performance
          customParameters: -batchmode -nographics -logFile -

      - name: Upload Performance Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-results
          path: artifacts/performance
          retention-days: 30